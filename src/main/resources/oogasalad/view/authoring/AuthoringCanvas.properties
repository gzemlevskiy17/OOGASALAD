## AuthoringCanvas grid settings
columns=160
rows=110
cellSize=20
gridLineSpacing=5

## Colors (RGB hex)
defaultFill=#FFFFFF
hoverFill=#000000
gridStroke=#D3D3D3
gridStrokeWidth=0.5

## Vehicle spawn reference (world-pixel units)
## Must match GameplaySessionFactoryImpl.buildWorld(): vehicleFactory.buildVehicle(..., 350, 300).
## Update both sides together if the gameplay spawn moves.
spawnX=350
spawnY=300
spawnMarkerRadius=8
spawnMarkerColor=#FF4D2E
spawnLabelOffsetX=14
spawnLabelOffsetY=4

## Horizontal guide line drawn through the spawn Y so designers can line up
## the "ground" underneath the vehicle instead of accidentally drawing terrain
## above the car (which causes it to fall into open air on play).
groundGuideColor=#FF4D2E
groundGuideStrokeWidth=1.5
groundGuideDashOn=10
groundGuideDashOff=6
