# Game catalog editor — inline prompts (prompt.*) and hover detail (tooltip.*).
# Ranges are suggestions for playable physics; engine may still accept values outside these bands.

# --- Catalog meta (game.json header) ---
prompt.catalog.meta.gameId=Game id (e.g. badpiggies)
tooltip.catalog.meta.gameId=Folder name under data/games/<id>/ for game.json. Use letters, digits, underscore; keep stable once levels reference it.

prompt.catalog.meta.mainCharacter=(set via Use as Main Character button)
tooltip.catalog.meta.mainCharacter=Must match a movable Components \"id\". Win/loss and HUD track this part—usually your cockpit/frame, not wheels.

# --- Terrain types tab ---
prompt.catalog.terrain.id=Terrain id (e.g. grass)
tooltip.catalog.terrain.id=Short lowercase id referenced by the level grid; unique within this catalog.

prompt.catalog.terrain.spriteUrl=data/assets/…png (optional)
tooltip.catalog.terrain.spriteUrl=Relative path copied under data/assets when you Browse. Leave blank to rely on solid fill color only.

prompt.catalog.terrain.color=#RRGGBB or color name
tooltip.catalog.terrain.color=Hex (#4A7B2A) or CSS color name used when no sprite or as tint hint.

prompt.catalog.terrain.friction=Friction (typical 0.4–0.8)
tooltip.catalog.terrain.friction=Coefficient ≥ 0. Rough ground ~0.6–1.0; smooth ~0.3–0.5; icy ~0.05–0.2. Higher resists sliding.

# --- Static objects tab ---
prompt.catalog.static.id=Static id (e.g. Heart)
tooltip.catalog.static.id=Matches palette entries for pickups and GoalLine-style markers.

prompt.catalog.static.spriteUrl=data/assets/…png (optional)
tooltip.catalog.static.spriteUrl=Sprite path for HUD/placement preview.

prompt.catalog.static.mass=Mass (usually 0)
tooltip.catalog.static.mass=Triggers and pickups use 0 so they stay kinematic sensors. Use small positive values only if you extend physics.

prompt.catalog.static.hpDelta=HP delta (+ heal / − hurt)
tooltip.catalog.static.hpDelta=Magnitude paired with heal/damage actions—often 10–50 per pickup so runs stay readable.

# --- Movable components tab ---
prompt.catalog.component.id=Component id (e.g. Frame)
tooltip.catalog.component.id=Matches vehicle builder palette ids and mainCharacterId. Short PascalCase or spaced names consistent with sprites.

prompt.catalog.component.spriteUrl=data/assets/…png
tooltip.catalog.component.spriteUrl=Displayed on parts in builder and gameplay.

prompt.catalog.component.mass=Mass (kg-scale, ~0.5–15)
tooltip.catalog.component.mass=Structural pieces often ~1–8; wheels lighter; motors heavier. Too low makes vehicles twitchy; too high needs stronger thrust.

prompt.catalog.component.buttonLabel=Button label (e.g. drive forward)
tooltip.catalog.component.buttonLabel=Shown on HUD tool buttons; maps to input bindings by label text.

prompt.catalog.component.directionX=Direction X (−1 to 1)
tooltip.catalog.component.directionX=Normalized thrust axis—typically 1 for forward along +x.

prompt.catalog.component.directionY=Direction Y (−1 to 1)
tooltip.catalog.component.directionY=Usually 0 for side-view cars; vertical thrust uses −1 for up.

# --- Selected terrain block (level canvas inspector) ---
tooltip.inspector.terrain.friction=Suggested 0–2 (engine friction ≥ 0). Match terrain feel to catalog defaults unless this block is special.

tooltip.inspector.terrain.restitution=Bounciness in [0, 1]. Ground usually 0–0.3; trampolines higher. Matches engine validation range.

# --- Level settings panel (global physics) ---
tooltip.level.gravity=Vertical acceleration magnitude (simulator units/s²). Panel allows roughly −50–0 here; tune until drops feel right vs. vehicle mass.

tooltip.level.drag=Air drag coefficient in [0, 1]; couples with World drag during play. Typical small values ~0.05–0.3 unless heavy damping desired.

tooltip.level.maxHp=Upper cap on vehicle-part HP authored for this level (often 50–500).

prompt.level.name=Display name for menus / saves
tooltip.level.name=Shown in level lists; file path may still differ.
