## Runtime configuration
modelName=gpt-4.1
systemPromptResource=/oogasalad/model/help/help-system-prompt.txt
requestTimeoutSeconds=30
apiKeyEnvVarName=OPENAI_API_KEY
baseUrlEnvVarName=OPENAI_BASE_URL

## Error messages
missingApiKeyError=Missing OpenAI API key in runtime configuration.
missingBaseUrlError=Missing OpenAI base URL in runtime configuration.
llmRequestFailureError=Unable to retrieve a response from the help assistant.
emptyUserMessageWarning=Cannot send an empty help message.
blankSystemPromptError=System prompt must not be blank.
emptyConversationError=Conversation must contain at least one message.
promptLoadFailureError=Unable to load the help chatbot system prompt.
