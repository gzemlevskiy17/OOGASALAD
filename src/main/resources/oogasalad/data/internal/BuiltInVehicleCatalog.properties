# Builtin Bad Piggies vehicle parts ? ids align with VehiclePartRegistry / wheel build rules.
# componentIds defines order (palette / idsNotYetInCatalog canonical order).

componentIds=BigPig,SmallPig,Balloon,Fan,Engine,Frame,Sled,Wood Wheel,Metal Wheel

BigPig.sprite=data/assets/vehicle/bp_bigPig.png
BigPig.mass=10

SmallPig.sprite=data/assets/vehicle/bp_smallPig.png
SmallPig.mass=5

Balloon.sprite=data/assets/vehicle/bp_balloon.png
Balloon.mass=1
# Buttons: semicolon-separated; each button is name|directionX|directionY
Balloon.buttons=Inflate|0|500

Fan.sprite=data/assets/vehicle/bp_fan.png
Fan.mass=3
Fan.buttons=Thrust Left|-400|0;Thrust Right|400|0

Engine.sprite=data/assets/vehicle/bp_engine.png
Engine.mass=8
Engine.buttons=Drive Left|-500|0;Drive Right|500|0

Frame.sprite=data/assets/vehicle/bp_frame.png
Frame.mass=6

Sled.sprite=data/assets/vehicle/bp_sled.png
Sled.mass=4

# Fix the reading issues
Wood\ Wheel.sprite=
Wood\ Wheel.mass=2

Metal\ Wheel.sprite=
Metal\ Wheel.mass=3